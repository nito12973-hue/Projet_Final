upstream santesn_app {
    server web:8000;
}
server {
    listen 443 ssl;
    server_name localhost santesn.sn www.santesn.sn;

    ssl_certificate /etc/ssl/certs/santesn.sn.crt;
    ssl_certificate_key /etc/ssl/private/santesn.sn.key;

    client_max_body_size 25M;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;

    # Fichiers statiques
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Fichiers médias
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Reverse proxy vers l'application Django Gunicorn
    location / {
        proxy_pass https://projet-final-bice.vercel.app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
