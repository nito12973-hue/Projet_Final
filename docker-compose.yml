services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santesn_web
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,santesn.sn,www.santesn.sn}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8000,http://127.0.0.1:8000}
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
      DATABASE_URL: ${DATABASE_URL}
      DELAI_VALIDITE_ORDONNANCE_JOURS: 90
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/connexion/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - santesn_network

  nginx:
    image: nginx:alpine
    container_name: santesn_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - santesn_network

volumes:
  static_volume:
  media_volume:
  logs_volume:

networks:
  santesn_network:
    driver: bridge
