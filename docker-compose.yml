services:
  db:
    image: postgres:17-alpine
    container_name: santesn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-santesn_db}
      POSTGRES_USER: ${DB_USER:-santesn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretPassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-santesn_user} -d ${DB_NAME:-santesn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - santesn_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santesn_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-santesn-docker-compose-production-secret-key-2026-dakar-ipm}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,santesn.sn,www.santesn.sn}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8000,http://127.0.0.1:8000}
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-santesn_db}
      DB_USER: ${DB_USER:-santesn_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecretPassword2026!}
      DB_HOST: db
      DB_PORT: 5432
      DELAI_VALIDITE_ORDONNANCE_JOURS: 90
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    expose:
      - 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/connexion/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - santesn_network

  nginx:
    image: nginx:alpine
    container_name: santesn_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - santesn_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  santesn_network:
    driver: bridge
