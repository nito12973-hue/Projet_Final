services:
  - type: web
    name: santesn-platform
    env: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_demo && gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
