name: CI/CD SanteSN - Tests et Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-santesn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Verification Django & Coherence
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 'ci-secret-key-santesn-django-security-token'
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DB_ENGINE: 'sqlite'
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnostic d integrite Django (check)
        run: |
          python manage.py check

      - name: Test de compilation des assets statiques (WhiteNoise)
        env:
          DEBUG: 'False'
        run: |
          python manage.py collectstatic --no-input

  tests-unitaires:
    name: Tests Automatises (Lot ${{ matrix.batch }})
    needs: lint-and-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: 1
            label: "Auth, Utilisateurs, Prestataires (288 tests)"
            targets: "Plateform_medicale.tests.UserManagerTests Plateform_medicale.tests.SetupWizardTests Plateform_medicale.tests.LandingTests Plateform_medicale.tests.LoginTests Plateform_medicale.tests.LimitationTentativesConnexionTests Plateform_medicale.tests.ProtectionDesVuesTests Plateform_medicale.tests.DashboardGestionnaireTests Plateform_medicale.tests.GestionUtilisateursTests Plateform_medicale.tests.ToastsMessagesTests Plateform_medicale.tests.EspaceMedecinTests Plateform_medicale.tests.RecherchePatientsMedecinTests Plateform_medicale.tests.PreRemplissagePatientConsultationTests Plateform_medicale.tests.FichePatientMedecinTests Plateform_medicale.tests.WidgetRecherchePatientsTests Plateform_medicale.tests.HistoriqueConsultationsTests Plateform_medicale.tests.EspacePharmacienTests Plateform_medicale.tests.EspaceAssureTests Plateform_medicale.tests.AdminPrestatairesTests Plateform_medicale.tests.RechercheLieuPrestataireTests Plateform_medicale.tests.DistanceKmTests Plateform_medicale.tests.PrestataireCoordonneesTests Plateform_medicale.tests.AdminPharmaciensTests Plateform_medicale.tests.AdminPatientFormTests Plateform_medicale.tests.NotificationsTests Plateform_medicale.tests.RendezVousNotificationsTests Plateform_medicale.tests.RapportsTests Plateform_medicale.tests.AdminMedecinsFormTests Plateform_medicale.tests.AdminServicesFormTests Plateform_medicale.tests.AdminPriseEnChargeFormTests Plateform_medicale.tests.PaiementTests Plateform_medicale.tests.PlanCouvertureAdminTests Plateform_medicale.tests.SuppressionCascadeTests Plateform_medicale.tests.PharmacienSuppressionCompteTests Plateform_medicale.tests.ValidationFormulairesTests Plateform_medicale.tests.RendezVousDateValidationTests Plateform_medicale.tests.ConsultationPriseEnChargeValidationTests Plateform_medicale.tests.ChangerMotDePasseTests Plateform_medicale.tests.ExportUtilisateursExcelTests Plateform_medicale.tests.ImportUtilisateursExcelTests Plateform_medicale.tests.PrestatairesProchesTests Plateform_medicale.tests.PaginationListesAdminTests"
          - batch: "2A"
            label: "Consultations & UX (180 tests)"
            targets: "Plateform_medicale.tests.ListeRendezVousAdminTests Plateform_medicale.tests.ListeOrdonnancesAdminTests Plateform_medicale.tests.ContexteShellTests Plateform_medicale.tests.DashboardGestionnaireContexteTests Plateform_medicale.tests.CompteursFilesAttenteGestionnaireTests Plateform_medicale.tests.ParametresEtMonCompteTests Plateform_medicale.tests.DeconnecterPartoutTests Plateform_medicale.tests.ParametresContenuTests Plateform_medicale.tests.RechercheOrdonnancePharmacienTests Plateform_medicale.tests.LibellesAccentuesTests Plateform_medicale.tests.PaginationHorsAdminTests Plateform_medicale.tests.ImportReglementsExcelTests Plateform_medicale.tests.NavigationCoherenteTests Plateform_medicale.tests.ConfirmationsActionsSensiblesTests Plateform_medicale.tests.BlocageMecanismeTests Plateform_medicale.tests.ComptesBloquesAdminTests Plateform_medicale.tests.MesPrisesEnChargeAssureTests Plateform_medicale.tests.CoherencePatientPriseEnChargeTests Plateform_medicale.tests.ListeConsultationsAdminTests Plateform_medicale.tests.FiltresListesNonAdminTests"
          - batch: "2B-JA"
            label: "Journal d Activite (10 tests)"
            targets: "Plateform_medicale.tests.JournalActiviteTests"
          - batch: "2B-CP1A"
            label: "Carte Prise en Charge 1A (6 tests)"
            targets: "Plateform_medicale.tests.CartePriseEnChargeTests.test_action_carte_presente_sur_la_liste_des_assures Plateform_medicale.tests.CartePriseEnChargeTests.test_apercu_recto_et_verso Plateform_medicale.tests.CartePriseEnChargeTests.test_aucune_notice_technique_sur_lecran_admin Plateform_medicale.tests.CartePriseEnChargeTests.test_carte_generee_pour_un_assure_principal Plateform_medicale.tests.CartePriseEnChargeTests.test_carte_generee_pour_un_ayant_droit_qui_na_pas_de_compte Plateform_medicale.tests.CartePriseEnChargeTests.test_edition_de_carte_journalisee"
          - batch: "2B-CP1B1"
            label: "Carte Prise en Charge 1B1 (3 tests)"
            targets: "Plateform_medicale.tests.CartePriseEnChargeTests.test_edition_de_carte_reservee_a_ladministrateur Plateform_medicale.tests.CartePriseEnChargeTests.test_la_page_prevoit_une_impression_dediee Plateform_medicale.tests.CartePriseEnChargeTests.test_le_qr_encode_ladresse_de_scan_et_aucune_donnee_medicale"
          - batch: "2B-CP1B2"
            label: "Carte Prise en Charge 1B2 (2 tests)"
            targets: "Plateform_medicale.tests.CartePriseEnChargeTests.test_le_qr_occupe_lessentiel_du_verso Plateform_medicale.tests.CartePriseEnChargeTests.test_le_scan_nest_pas_journalise"
          - batch: "2B-CP2"
            label: "Carte Prise en Charge B (11 tests)"
            targets: "Plateform_medicale.tests.CartePriseEnChargeTests.test_le_scan_nouvre_pas_le_diagnostic Plateform_medicale.tests.CartePriseEnChargeTests.test_medecin_ne_voit_que_ses_propres_prescriptions Plateform_medicale.tests.CartePriseEnChargeTests.test_numero_de_carte_correct_et_unique Plateform_medicale.tests.CartePriseEnChargeTests.test_pharmacien_ne_voit_que_les_ordonnances_non_delivrees Plateform_medicale.tests.CartePriseEnChargeTests.test_recto_ninvente_ni_photo_ni_expiration Plateform_medicale.tests.CartePriseEnChargeTests.test_recto_porte_les_informations_reelles Plateform_medicale.tests.CartePriseEnChargeTests.test_scan_anonyme_renvoie_vers_la_connexion Plateform_medicale.tests.CartePriseEnChargeTests.test_scan_dun_numero_inconnu_donne_404 Plateform_medicale.tests.CartePriseEnChargeTests.test_scan_par_un_pharmacien_autorise Plateform_medicale.tests.CartePriseEnChargeTests.test_scan_refuse_a_lassure_et_a_ladministrateur Plateform_medicale.tests.CartePriseEnChargeTests.test_verso_porte_un_vrai_qr_svg"
          - batch: "2B-QR"
            label: "Mon QR Code Assure (5 tests)"
            targets: "Plateform_medicale.tests.MonQrCodeAssureTests"
          - batch: "2B-MO"
            label: "Colonnes Mobiles (5 tests)"
            targets: "Plateform_medicale.tests.ColonnesOptionnellesMobileTests"
          - batch: "2B-RM"
            label: "Recherche Medecins Admin (6 tests)"
            targets: "Plateform_medicale.tests.RechercheMedecinsAdminTests"
          - batch: "2B-1B"
            label: "Documents & Requetes (43 tests)"
            targets: "Plateform_medicale.tests.CloisonnementParUrlTests Plateform_medicale.tests.OrdonnanceDocumentTests Plateform_medicale.tests.LisibiliteDesChampsTests Plateform_medicale.tests.ContrasteThemeSombreTests Plateform_medicale.tests.RequetesConstantesTests"
          - batch: "2B-2"
            label: "Securite, Cartes & Onboarding (88 tests)"
            targets: "Plateform_medicale.tests.ParcoursCompletsTests Plateform_medicale.tests.LigneOrdonnanceTests Plateform_medicale.tests.FormulaireOrdonnanceMedecinTests Plateform_medicale.tests.SalutationDashboardsTests Plateform_medicale.tests.ParcoursPrestataireMedecinTests Plateform_medicale.tests.TracePaiementEspecesTests Plateform_medicale.tests.RechercheEtablissementReelTests Plateform_medicale.tests.CarteAssureCasLimitesTests Plateform_medicale.tests.CreneauUniqueParMedecinTests Plateform_medicale.tests.AuditIdorEtSecuriteEmpiriqueTests Plateform_medicale.tests.OnboardingEtActivationTests"
          - batch: 3
            label: "Plafonds, WhatsApp, Multi-Tenant, Supervision (311 tests)"
            targets: "Plateform_medicale.tests.WhatsAppServiceTests Plateform_medicale.tests.RapportsKpiEtPdfTests Plateform_medicale.tests.RapportsExcelMultiFeuillesTests Plateform_medicale.tests.ImportUtilisateursConfidentialiteTests Plateform_medicale.tests.ProductiviteMetierV11Tests Plateform_medicale.tests.PlafondAnnuelTests Plateform_medicale.tests.Phase1SecuriteIntegriteTests Plateform_medicale.tests.Phase2UXTests Plateform_medicale.tests.CorrectionsAuditMetierTests Plateform_medicale.tests.WorkflowConsultationsEtUrgencesTests Plateform_medicale.tests.AuditParcoursUtilisateurTests Plateform_medicale.tests.SynchronisationIdentiteTests Plateform_medicale.tests.VisibiliteComptesBloquesP1ATests Plateform_medicale.tests.TracabiliteBlocagesP1BTests Plateform_medicale.tests.NotificationAyantDroitP1Tests Plateform_medicale.tests.AssistantEtSupportTests Plateform_medicale.tests.PreLaunchAuditAndLegalPagesTests Plateform_medicale.tests.TestAmeliorationsPlateformeSN Plateform_medicale.tests.AuditCorrectionsTests Plateform_medicale.tests.PasswordResetSelfServiceTests Plateform_medicale.tests.AyantDroitValidationAntiFraudeTests Plateform_medicale.tests.CarteDematerialiseeEtDroitsSaaSTests Plateform_medicale.tests.JaugePlafondAnnuelIPMTests Plateform_medicale.tests.MediaFilesServingTests Plateform_medicale.tests.BonPriseEnChargePDFTests Plateform_medicale.tests.SceauIntegriteOrdonnanceTests Plateform_medicale.tests.BordereauTeletransmissionTests Plateform_medicale.tests.PWAModeHorsLigneTests Plateform_medicale.tests.ConformiteCDPTests Plateform_medicale.tests.IsolationMultiOrganismesEtape1Tests Plateform_medicale.tests.ConventionPrestataireTests Plateform_medicale.tests.SupervisionTechniqueTests Plateform_medicale.tests.RemboursementHorsReseauEtIsolationMultiTenantTests Plateform_medicale.tests.MultiTenantSecurityAndPenetrationTests Plateform_medicale.tests.OrganismeScopedQuerySetTests Plateform_medicale.tests.ParcoursUtilisateursCompletsTests Plateform_medicale.tests.WhatsAppBotAndWebhookTests Plateform_medicale.tests.AuditSecuriteTests Plateform_medicale.tests.SeparationRolesAdminGestionnaireTests Plateform_medicale.tests.PagesJuridiquesTests Plateform_medicale.tests.RecherchePrestatairesToleranteTests"
    env:
      SECRET_KEY: 'ci-secret-key-santesn-django-security-token'
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DB_ENGINE: 'sqlite'
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execution du lot de tests ${{ matrix.batch }} (${{ matrix.label }})
        run: |
          python manage.py test ${{ matrix.targets }} --verbosity=2

  bilan-qualite:
    name: Bilan d Integrite CI/CD
    needs: tests-unitaires
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verification du statut global
        run: |
          if [ "${{ needs.tests-unitaires.result }}" = "success" ]; then
            echo "=============================================="
            echo "  TOUS LES 952 TESTS D INTEGRITE SONT VERTS !  "
            echo "=============================================="
            exit 0
          else
            echo "Echec sur un des lots de tests d integrite."
            exit 1
          fi
