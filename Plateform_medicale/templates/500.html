            padding: 12px 24px;
            min-height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #064e3b 0%, #0f766e 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(6, 78, 59, 0.2);
            transition: all 0.15s ease;
        }
        a:hover {
            transform: translateY(-1px);
