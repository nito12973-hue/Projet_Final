<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès réservé — SantéSN</title>
    <meta name="theme-color" content="#0b2027">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='18' y='6' width='12' height='36' rx='4' fill='%230e7c86'/%3E%3Crect x='6' y='18' width='36' height='12' rx='4' fill='%230e7c86'/%3E%3Cpath d='M6 24H14L17 16L21 32L25 19L27.5 24H42' fill='none' stroke='%23e0824f' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', -apple-system, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .carte {
            max-width: 480px;
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 16px 36px -4px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 52px;
            margin: 0 0 6px;
            color: #0f172a;
            font-weight: 800;
        }
        h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 20px;
            margin: 0 0 12px;
            color: #0f172a;
            font-weight: 700;
        }
        p {
            color: #64748b;
            font-size: 14.5px;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 14px;
            min-height: 30px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 11.5px;
            transition: all 0.15s ease;
        }
        .btn-principal {
            background: linear-gradient(135deg, #064e3b 0%, #0f766e 100%);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(6, 78, 59, 0.15);
        }
        .btn-principal:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(6, 78, 59, 0.25);
        }
        .btn-secondaire {
            background: #f0fdfa;
            color: #0f766e;
            border: 1px solid #ccfbf1;
        }
        .btn-secondaire:hover {
            background: #e6f7f5;
        }
    </style>
</head>
<body>
    <div class="carte">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="margin-bottom:12px;">
            <rect x="18" y="6" width="12" height="36" rx="4" fill="#0B2027"/>
            <rect x="6" y="18" width="36" height="12" rx="4" fill="#0B2027"/>
            <path d="M6 24H14L17 16L21 32L25 19L27.5 24H42" fill="none" stroke="#E0824F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>403</h1>
        <h2>Accès réservé</h2>
        <p>Cette page est strictement réservée à un autre profil d'utilisateur (administrateur, médecin ou pharmacien). Pour continuer, revenez à votre espace ou connectez-vous avec le compte approprié.</p>
        <div class="actions">
            <a href="/redirection/" class="btn-principal">Retour à mon espace</a>
            <a href="/connexion/" class="btn-secondaire">Changer de compte</a>
        </div>
    </div>
</body>
</html>
