{% extends "base.html" %}

{% block title %}Mon profil{% endblock %}

{% block content %}
<section class="page-title">
    <div>
        <h1>Mon profil</h1>
        <p class="subtitle">Dr {{ medecin.prenom }} {{ medecin.nom }} - {{ medecin.email }}</p>
    </div>
</section>

<section class="panel" style="padding: 22px 24px; max-width: 720px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="erreurs" role="alert">{{ field.errors }}</div>{% endif %}
        {% endfor %}
        <button class="button primary" type="submit">Enregistrer</button>
    </form>
</section>
{% endblock %}
