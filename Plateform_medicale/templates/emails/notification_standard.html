<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; color: #1e293b; margin: 0; padding: 20px; }
        .email-card { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .email-header { background-color: #12885a; padding: 24px; text-align: center; color: #ffffff; }
        .email-header h1 { margin: 0; font-size: 22px; font-weight: 700; }
        .email-body { padding: 28px; line-height: 1.6; }
        .email-title { font-size: 18px; font-weight: 600; color: #0f172a; margin-top: 0; margin-bottom: 16px; }
        .email-btn { display: inline-block; background-color: #12885a; color: #ffffff !important; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; margin-top: 20px; }
        .email-footer { background-color: #f8fafc; padding: 16px 24px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="email-card">
        <div class="email-header">
            <h1>SantéSN</h1>
        </div>
        <div class="email-body">
            <h2 class="email-title">{{ titre }}</h2>
            <p>Bonjour {{ user.get_full_name|default:user.email }},</p>
            <p>{{ message }}</p>
            {% if url_action %}
            <div style="text-align: center; margin-top: 28px; margin-bottom: 16px;">
                <a href="http://127.0.0.1:8000{{ url_action }}" class="email-btn">Consulter sur SantéSN</a>
            </div>
            {% endif %}
        </div>
        <div class="email-footer">
            <p>Ceci est un message automatique envoyé par la plateforme SantéSN.<br>Pour des raisons de sécurité, ne répondez pas à cet email.</p>
        </div>
    </div>
</body>
</html>
